<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>One real cooling cycle of the keezer with a plain thermostat</title>
<desc>Temperature over 24 hours. The compressor starts at 39.5F and stops at 38.5F, but the temperature keeps falling about 1.65F more to a low near 36.7F before slowly rising again.</desc>
<rect width="1000" height="560" rx="14" fill="#0f1722"/>
<text x="64" y="34" fill="#e8eef7" font-size="20" font-weight="700">The problem coast-aware control solves</text>
<text x="64" y="56" fill="#93a4bb" font-size="13">24 hours of real readings from the keezer (target 39.0°F, swing ±0.5°F, plain thermostat). Each cycle dips far below the low edge.</text>
