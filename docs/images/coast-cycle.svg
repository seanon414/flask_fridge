<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>The problem coast-aware control solves</title>
<desc>Temperature history with one compressor cycle annotated: it starts near 39.5F, stops near 38.3F, keeps falling to about 36.8F, then warms again.</desc>
<rect width="1000" height="560" rx="14" fill="#0f1722"/>
<text x="64" y="34" fill="#e8eef7" font-size="20" font-weight="700">The problem coast-aware control solves</text>
<text x="64" y="56" fill="#93a4bb" font-size="13">Real readings from the keezer (target 39.0°F, swing ±0.5°F, plain thermostat). Each cycle dips far below the low edge.</text>
