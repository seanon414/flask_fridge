<text x="54" y="235.0" fill="#7d8ea6" font-size="12" text-anchor="end">38°</text>
<line x1="64" x2="972" y1="161.4" y2="161.4" stroke="#223044" stroke-width="1"/>
<text x="54" y="165.4" fill="#7d8ea6" font-size="12" text-anchor="end">39°</text>
<line x1="64" x2="972" y1="91.9" y2="91.9" stroke="#223044" stroke-width="1"/>
<text x="54" y="95.9" fill="#7d8ea6" font-size="12" text-anchor="end">40°</text>
<line x1="205.3" x2="205.3" y1="78" y2="370" stroke="#182334" stroke-width="1"/>
<text x="205.3" y="390" fill="#7d8ea6" font-size="12" text-anchor="middle">12 AM</text>
<line x1="365.9" x2="365.9" y1="78" y2="370" stroke="#182334" stroke-width="1"/>
<text x="365.9" y="390" fill="#7d8ea6" font-size="12" text-anchor="middle">4 AM</text>
<line x1="526.4" x2="526.4" y1="78" y2="370" stroke="#182334" stroke-width="1"/>
<text x="526.4" y="390" fill="#7d8ea6" font-size="12" text-anchor="middle">8 AM</text>
<line x1="687.0" x2="687.0" y1="78" y2="370" stroke="#182334" stroke-width="1"/>
<text x="687.0" y="390" fill="#7d8ea6" font-size="12" text-anchor="middle">12 PM</text>
<line x1="847.5" x2="847.5" y1="78" y2="370" stroke="#182334" stroke-width="1"/>
<text x="847.5" y="390" fill="#7d8ea6" font-size="12" text-anchor="middle">4 PM</text>
<rect x="64" y="126.7" width="908" height="69.5" fill="#4cc9f0" fill-opacity="0.13"/>
<line x1="64" x2="972" y1="161.4" y2="161.4" stroke="#4cc9f0" stroke-opacity="0.55" stroke-dasharray="6 5"/>
<text x="966" y="120.7" fill="#7fd3ee" font-size="12" text-anchor="end">target band 38.5 – 39.5°F</text>
<text x="54" y="417" fill="#7d8ea6" font-size="11" text-anchor="end">on</text>
