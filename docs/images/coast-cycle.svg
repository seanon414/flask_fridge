<circle cx="516.9" cy="343.2" r="12" fill="#ff6b81" stroke="#0f1722" stroke-width="2"/>
<text x="516.9" y="347.7" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">4</text>
<circle cx="618.8" cy="231.6" r="12" fill="#a9bad1" stroke="#0f1722" stroke-width="2"/>
<text x="618.8" y="236.1" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">5</text>
<circle cx="72" cy="442" r="9" fill="#f0a04b"/>
<text x="72" y="446" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">1</text>
<text x="90" y="446" fill="#cfd9e8" font-size="13">The compressor starts when the temperature reaches the 39.5°F high edge.</text>
<circle cx="72" cy="464" r="9" fill="#f0a04b"/>
<text x="72" y="468" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">2</text>
<text x="90" y="468" fill="#cfd9e8" font-size="13">About 25 minutes later it reaches the 38.5°F low edge and the controller stops it.</text>
<circle cx="72" cy="486" r="9" fill="#ff6b81"/>
<text x="72" y="490" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">3</text>
<text x="90" y="490" fill="#cfd9e8" font-size="13">The temperature keeps falling about 1.65°F more after the stop: the “coast”.</text>
<circle cx="72" cy="508" r="9" fill="#ff6b81"/>
<text x="72" y="512" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">4</text>
<text x="90" y="512" fill="#cfd9e8" font-size="13">It bottoms out near 36.7°F, almost 2°F under the band, so the average sits well under the target.</text>
<circle cx="72" cy="530" r="9" fill="#a9bad1"/>
<text x="72" y="534" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">5</text>
<text x="90" y="534" fill="#cfd9e8" font-size="13">Then it warms slowly (about 4 hours) until the high edge is reached again.</text>
<text x="972" y="548" fill="#5f7089" font-size="11" text-anchor="end">orange strip = compressor running · times are the Pi's local time</text>
</svg>
