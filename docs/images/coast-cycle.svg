<circle cx="350.1" cy="149.3" r="12" fill="#f0a04b" stroke="#0f1722" stroke-width="2"/>
<text x="350.1" y="153.8" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">1</text>
<circle cx="422.7" cy="228.6" r="12" fill="#f0a04b" stroke="#0f1722" stroke-width="2"/>
<text x="422.7" y="233.1" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">2</text>
<circle cx="432.7" cy="281.2" r="12" fill="#ff6b81" stroke="#0f1722" stroke-width="2"/>
<text x="432.7" y="285.7" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">3</text>
<circle cx="481.6" cy="347.9" r="12" fill="#ff6b81" stroke="#0f1722" stroke-width="2"/>
<text x="481.6" y="352.4" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">4</text>
<circle cx="625.5" cy="253.6" r="12" fill="#a9bad1" stroke="#0f1722" stroke-width="2"/>
<text x="625.5" y="258.1" fill="#0f1722" font-size="13" font-weight="800" text-anchor="middle">5</text>
<circle cx="72" cy="442" r="9" fill="#f0a04b"/>
<text x="72" y="446" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">1</text>
<text x="90" y="446" fill="#cfd9e8" font-size="13">The compressor starts when the temperature reaches the high edge (39.5°F).</text>
<circle cx="72" cy="464" r="9" fill="#f0a04b"/>
<text x="72" y="468" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">2</text>
<text x="90" y="468" fill="#cfd9e8" font-size="13">It runs about 26 minutes, and the controller stops it at about 38.3°F (the low edge is 38.5°F).</text>
<circle cx="72" cy="486" r="9" fill="#ff6b81"/>
<text x="72" y="490" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">3</text>
<text x="90" y="490" fill="#cfd9e8" font-size="13">The temperature keeps falling about 1.5°F more after the stop: the “coast”.</text>
<circle cx="72" cy="508" r="9" fill="#ff6b81"/>
<text x="72" y="512" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">4</text>
<text x="90" y="512" fill="#cfd9e8" font-size="13">It bottoms out near 36.8°F, 1.7°F under the low edge.</text>
<circle cx="72" cy="530" r="9" fill="#a9bad1"/>
<text x="72" y="534" fill="#0f1722" font-size="11" font-weight="800" text-anchor="middle">5</text>
<text x="90" y="534" fill="#cfd9e8" font-size="13">Then it warms for about 3.0 hours until it reaches the high edge again.</text>
<text x="972" y="548" fill="#5f7089" font-size="11" text-anchor="end">orange strip = compressor running · times are local to the computer that drew this</text>
</svg>
