# Runs both test suites on every pull request and on every push to master.
# Master is protected so that a pull request can only be merged once both jobs pass
# (see docs/operations.md, "Branch protection and CI").
#
# The actions are pinned to exact commits, not tags, so a moved tag cannot change what runs.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.9'            # what the Pi runs
          cache: pip
          cache-dependency-path: requires.txt
      - run: pip install -r requires.txt
      # DATABASE_URL=sqlite:// is required: the tests refuse to run against a real database
      - run: python -m unittest discover -s app/tests -t . -v
        env:
          DATABASE_URL: sqlite://

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
